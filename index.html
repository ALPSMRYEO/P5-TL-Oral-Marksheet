            const maxReading = isFoundation ? 15 : 20;
            const maxConv = isFoundation ? 40 : 30;
            const maxTotal = isFoundation ? 55 : 50;

            const generateSystemText = () => {
                let readingParts = [];
                if (selections.readingPron !== null) readingParts.push(currentRubrics.readingPron.items[selections.readingPron].feedback);
                if (selections.readingFluency !== null) readingParts.push(currentRubrics.readingFluency.items[selections.readingFluency].feedback);
                const generatedReadingFeedback = readingParts.join(" ");

                let convParts = [];
                if (selections.convResponse !== null) convParts.push(currentRubrics.convResponse.items[selections.convResponse].feedback);
                if (selections.convLanguage !== null) convParts.push(currentRubrics.convLanguage.items[selections.convLanguage].feedback);
                const generatedConvFeedback = convParts.join(" ");

                let finalParts = [];
                if (generatedReadingFeedback) finalParts.push(`【வாய்விட்டு வாசித்தல்】\n${generatedReadingFeedback}`);
                if (generatedConvFeedback) finalParts.push(`【உரையாடல்】\n${generatedConvFeedback}`);
                
                return finalParts.join("\n\n");
            };

            // Smart Merge for Auto Feedback
            useEffect(() => {
                const newSystemText = generateSystemText();
                
                if (newSystemText !== lastGeneratedRef.current) {
                    setFeedbackText(prevText => {
                        if (!prevText.trim()) return newSystemText;
                        
                        if (lastGeneratedRef.current && prevText.includes(lastGeneratedRef.current)) {
                            return prevText.replace(lastGeneratedRef.current, newSystemText);
                        }
                        
                        let extractedCustom = prevText;
                        Object.values(rubricsData).forEach(rubricSet => {
                            Object.values(rubricSet).forEach(category => {
                                category.items.forEach(item => {
                                    if (item.feedback) {
                                        extractedCustom = extractedCustom.split(item.feedback).join('');
                                    }
                                });
                            });
                        });

                        extractedCustom = extractedCustom.split('【வாய்விட்டு வாசித்தல்】').join('');
                        extractedCustom = extractedCustom.split('【உரையாடல்】').join('');
                        extractedCustom = extractedCustom.replace(/\n\s*\n/g, '\n').trim();
                        
                        return newSystemText + (extractedCustom ? "\n\n" + extractedCustom : "");
                    });
                    
                    lastGeneratedRef.current = newSystemText;
                }
            }, [selections, currentRubrics]);

            const handleSyllabusChange = (newSyllabus) => {
                if (newSyllabus === syllabus) return;

                const hasScores = Object.values(scores).some(val => val > 0);
                if (hasScores) {
                    setDialog({
                        isOpen: true,
                        title: 'மதிப்பீட்டு நிலையை மாற்றவா?',
                        message: 'நிலையை மாற்றினால் தற்போதைய மதிப்பெண்களும் பின்னூட்டக் குறிப்புகளும் அழிக்கப்படும். தொடர விரும்புகிறீர்களா?',
                        type: 'confirm',
                        onConfirm: () => {
                            setSyllabus(newSyllabus);
                            clearScores();
                            setStudent({ class: '', name: '', index: '', mtl: '' });
                        }
                    });
                } else {
                    setSyllabus(newSyllabus);
                    setStudent({ class: '', name: '', index: '', mtl: '' });
                }
            };

            const clearScores = () => {
                setScores({ readingPron: 0, readingFluency: 0, convResponse: 0, convLanguage: 0 });
                setSelections({ readingPron: null, readingFluency: null, convResponse: null, convLanguage: null });
                setFeedbackText('');
                lastGeneratedRef.current = '';
            };

            const handleSelect = (category, itemIndex, selectedScore) => {
                setSelections(prev => ({ ...prev, [category]: itemIndex }));
                setScores(prev => ({ ...prev, [category]: selectedScore }));
            };

            const handleScoreChange = (category, value) => {
                let num = parseInt(value) || 0;
                if (num > currentRubrics[category].max) num = currentRubrics[category].max;
                setScores(prev => ({ ...prev, [category]: num }));
                setSelections(prev => ({ ...prev, [category]: null })); 
            };

            const handleExaminerChange = (e) => {
                const val = e.target.value;
                setCurrentExaminer(val);
                localStorage.setItem('oralExamExaminer', val);
            };

            const handleSavePDF = async () => {
                const element = document.querySelector('.print-container');
                if (!element) return;

                const fileName = student.name
                    ? `${student.class}_${student.name}_வாய்மொழி_மதிப்பீடு.pdf`
                    : `வாய்மொழி_மதிப்பீடு_${student.class || 'Class'}.pdf`;

                // The PDF-only report is hidden on screen, so reveal it briefly for rendering.
                const previousDisplay = element.style.display;
                const previousWidth = element.style.width;
                element.style.display = 'flex';
                element.style.width = '190mm';

                const options = {
                    margin: [10, 10, 10, 10],
                    filename: fileName,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                    pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
                };

                try {
                    const worker = html2pdf().set(options).from(element).toPdf();
                    const pdfBlob = await worker.outputPdf('blob');

                    // Chrome/Edge: open the real Save As dialog. No Print screen.
                    if ('showSaveFilePicker' in window) {
                        try {
                            const fileHandle = await window.showSaveFilePicker({
                                suggestedName: fileName,
                                types: [{
                                    description: 'PDF Document',
                                    accept: { 'application/pdf': ['.pdf'] }
                                }]
                            });
                            const writable = await fileHandle.createWritable();
                            await writable.write(pdfBlob);
                            await writable.close();
                        } catch (saveError) {
                            // If the user cancels Save As, do nothing.
                            if (saveError && saveError.name !== 'AbortError') throw saveError;
                        }
                    } else {
                        // Apps Script / browsers that block the File System Access API:
                        // open the generated PDF in the browser PDF viewer instead of downloading it.
                        // The user can then click the PDF viewer's Save icon to choose the folder/name.
                        const url = URL.createObjectURL(pdfBlob);
                        const pdfWindow = window.open(url, '_blank');
                        if (!pdfWindow) {
                            setDialog({
                                isOpen: true,
                                title: 'PDF தயார்',
                                message: 'PDF புதிய tab-ல் திறக்க browser pop-ups-ஐ அனுமதிக்கவும்.',
                                type: 'alert'
                            });
                        }
                        setTimeout(() => URL.revokeObjectURL(url), 60000);
                    }
                } catch (error) {
                    console.error('PDF save error:', error);
                    setDialog({
                        isOpen: true,
                        title: 'PDF சேமிக்க முடியவில்லை',
                        message: 'PDF கோப்பை உருவாக்க முடியவில்லை. தயவுசெய்து மீண்டும் முயற்சி செய்யவும்.',
                        type: 'alert'
                    });
                } finally {
                    element.style.display = previousDisplay;
                    element.style.width = previousWidth;
                }
            };

            const filteredStudents = useMemo(() => {
                if (!student.class) return [];
                return roster.filter(s => s.subjectType === syllabus && s.class === student.class);
            }, [roster, syllabus, student.class]);

            const availableClasses = useMemo(() => {
                const classes = new Set(roster.filter(s => s.subjectType === syllabus).map(s => s.class));
                return Array.from(classes).sort();
            }, [roster, syllabus]);

            const handleStudentSelect = (e) => {
                const selectedName = e.target.value;
                const found = roster.find(s => s.name === selectedName && s.class === student.class && s.subjectType === syllabus);
                if (found) {
                    setStudent(found);
                } else {
                    setStudent({ ...student, name: selectedName, index: '', mtl: '' });
                }
            };

            const handleSubmitGAS = async () => {
                if (!student.class) {
                    setDialog({ isOpen: true, title: 'நினைவூட்டல்', message: 'தயவுசெய்து முதலில் வகுப்பைத் தேர்ந்தெடுக்கவும்!', type: 'alert' });
                    return;
                }
                if (!student.name || !currentExaminer) {
                    setDialog({ isOpen: true, title: 'நினைவூட்டல்', message: 'மாணவரின் பெயரையும் மதிப்பீட்டாளரின் பெயரையும் தேர்ந்தெடுப்பதை உறுதிசெய்யவும்.', type: 'alert' });
                    return;
                }

                setSubmitStatus('loading');
                
                const payload = {
                    className: student.class,
                    indexNo: student.index,
                    studentName: student.name,
                    examiner: currentExaminer,
                    mtl: student.mtl,
                    syllabus: syllabus === 'standard' ? 'Standard Tamil Language' : 'Foundation Tamil Language',
                    
                    readingPronScore: scores.readingPron,       
                    readingFluencyScore: scores.readingFluency,   
                    readingCombinedScore: readingCombined,       
                    
                    convResponseScore: scores.convResponse,       
                    convLanguageScore: scores.convLanguage,       
                    convCombinedScore: convTotal,                 
                    
                    totalScore: grandTotal,                       
                    maxTotal: maxTotal,
                    feedback: feedbackText,
                    timestamp: new Date().toLocaleString('en-SG', { hour12: false })
                };

                try {
                    const response = await fetch(gasUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });
                    
                    setSubmitStatus('idle');
                    setDialog({ 
                        isOpen: true, 
                        title: '✅ வெற்றிகரமாகச் சமர்ப்பிக்கப்பட்டது!', 
                        message: `${student.name} மாணவருக்கான மதிப்பெண்களும் பின்னூட்டமும் Cloud-இல் சேமிக்கப்பட்டுள்ளன.`, 
                        type: 'alert',
                        isSuccess: true 
                    });
                } catch (error) {
                    setSubmitStatus('idle');
                    setDialog({ isOpen: true, title: 'சமர்ப்பிக்க முடியவில்லை', message: 'இணையக் கோளாறு அல்லது பிழை. மீண்டும் முயற்சிக்கவும்.', type: 'alert' });
                }
            };

            const resetForm = () => {
                setDialog({
                    isOpen: true,
                    title: 'படிவத்தை அழிக்கவா?',
                    message: 'அடுத்த மாணவரை மதிப்பிட இந்தப் படிவத்தின் தற்போதைய மதிப்பெண்களை அழிக்க விரும்புகிறீர்களா?',
                    type: 'confirm',
                    onConfirm: () => {
                        setStudent(prev => ({ ...prev, name: '', index: '', mtl: '' }));
                        clearScores();
                    }
                });
            }

            const renderRubricRow = (categoryKey, rubricObj) => (
                <div className="mb-10 bg-white p-5 md:p-6 rounded-2xl shadow-sm border border-slate-200 no-print">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                        <h3 className="font-bold text-xl md:text-2xl text-slate-800">
                            {rubricObj.title}
                        </h3>
                        <div className="flex items-center space-x-3 bg-blue-50 px-4 py-2 rounded-xl border border-blue-200 w-full md:w-auto justify-between md:justify-start">
                            <span className="text-base md:text-lg text-blue-900 font-bold">மதிப்பெண்:</span>
                            <div className="flex items-baseline">
                                <input 
                                    type="number" 
                                    min="0" max={rubricObj.max}
                                    value={scores[categoryKey]} 
                                    onChange={(e) => handleScoreChange(categoryKey, e.target.value)}
                                    className="w-16 text-center font-black text-2xl text-blue-700 bg-transparent border-b-2 border-blue-300 focus:outline-none focus:border-blue-700 transition-colors"
                                />
                                <span className="text-slate-500 font-medium ml-1">/{rubricObj.max}</span>
                            </div>
                        </div>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-5 gap-4">
                        {rubricObj.items.map((item, index) => {
                            const isSelected = selections[categoryKey] === index;
                            return (
                                <div 
                                    key={index}
                                    onClick={() => handleSelect(categoryKey, index, item.scores[item.scores.length - 1])}
                                    className={`cursor-pointer rounded-xl p-4 transition-all duration-200 border-2 flex flex-col ${
                                        isSelected 
                                        ? 'border-blue-600 bg-blue-50 shadow-md ring-4 ring-blue-100 scale-[1.02]' 
                                        : 'border-slate-200 hover:border-blue-400 hover:bg-slate-50'
                                    }`}
                                >
                                    <div className="flex flex-wrap gap-2 mb-3">
                                        {item.scores.map(s => (
                                            <button
                                                key={s}
                                                onClick={(e) => {
                                                    e.stopPropagation();
                                                    handleSelect(categoryKey, index, s);
                                                }}
                                                className={`w-9 h-9 md:w-10 md:h-10 rounded-lg flex items-center justify-center text-sm md:text-base font-black transition-all ${
                                                    isSelected && scores[categoryKey] === s 
                                                    ? 'bg-blue-600 text-white shadow-lg scale-110' 
                                                    : 'bg-white border-2 border-slate-300 text-slate-600 hover:bg-blue-100 hover:text-blue-800 hover:border-purple-400'
                                                }`}
                                            >
                                                {s}
                                            </button>
                                        ))}
                                    </div>
                                    <div className={`font-bold text-lg mb-2 ${isSelected ? 'text-blue-800' : 'text-slate-700'}`}>
                                        {item.label}
                                    </div>
                                    <div className={`text-sm leading-relaxed flex-grow ${isSelected ? 'text-blue-900/80 font-medium' : 'text-slate-500'}`}>
                                        {item.desc}
                                    </div>
                                </div>
                            )
                        })}
                    </div>
                </div>
            );

            return (
                <div className="max-w-7xl mx-auto p-4 md:p-6 lg:p-8">
                    
                    {/* Modal Dialogs */}
                    {dialog.isOpen && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm px-4 no-print">
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden transform transition-all border border-slate-200">
                                <div className={`p-10 ${dialog.isSuccess ? 'bg-green-50 text-center' : ''}`}>
                                    {dialog.isSuccess && <div className="text-7xl mb-6">🎉</div>}
                                    <h3 className={`font-black text-3xl mb-4 ${dialog.isSuccess ? 'text-green-800' : 'text-slate-900'}`}>
                                        {dialog.title || 'அறிவிப்பு'}
                                    </h3>
                                    <p className={`leading-relaxed text-xl ${dialog.isSuccess ? 'text-green-900 font-medium' : 'text-slate-600'}`}>
                                        {dialog.message}
                                    </p>
                                </div>
                                <div className="p-6 bg-slate-50 border-t border-slate-100 flex justify-center space-x-4">
                                    {dialog.type === 'confirm' && (
                                        <button 
                                            onClick={() => setDialog({ ...dialog, isOpen: false })} 
                                            className="px-8 py-4 text-slate-600 font-bold text-lg hover:bg-slate-200 rounded-xl transition-colors w-full"
                                        >
                                            ரத்து செய்
                                        </button>
                                    )}
                                    <button 
                                        onClick={() => { 
                                            if(dialog.onConfirm) dialog.onConfirm(); 
                                            setDialog({ ...dialog, isOpen: false, isSuccess: false }); 
                                        }} 
                                        className={`px-8 py-4 text-white font-black text-lg rounded-xl shadow-lg transition-colors w-full ${dialog.isSuccess ? 'bg-green-600 hover:bg-green-700' : 'bg-blue-600 hover:bg-blue-700'}`}
                                    >
                                        சரி
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Top Navigation & Info Bar */}
                    <div className="sticky top-0 z-10 bg-white/95 backdrop-blur-xl shadow-md border-b border-slate-200 rounded-b-3xl p-4 lg:p-5 mb-8 flex flex-col xl:flex-row justify-between items-start xl:items-center no-print gap-4 transition-all">
                        
                        <div className="flex flex-col space-y-4 w-full xl:w-auto">
                            {/* App Title and Actions */}
                            <div className="flex flex-col sm:flex-row items-start sm:items-center gap-4">
                                <span className="text-2xl font-black bg-gradient-to-r from-blue-700 to-indigo-700 bg-clip-text text-transparent drop-shadow-sm whitespace-nowrap">Alexandra வாய்மொழி மதிப்பீடு – தொடக்கநிலை 5 (2026)</span>
                                
                                {/* Syllabus Toggle */}
                                <div className="flex bg-white p-1 rounded-xl border border-slate-200 shadow-sm">
                                    <button
                                        onClick={() => handleSyllabusChange('standard')}
                                        className={`px-4 py-1.5 rounded-lg font-bold text-sm transition-all ${syllabus === 'standard' ? 'bg-slate-100 text-blue-700 shadow-inner' : 'text-slate-500 hover:text-slate-700'}`}
                                    >
                                        சாதாரண (Standard)
                                    </button>
                                    <button
                                        onClick={() => handleSyllabusChange('foundation')}
                                        className={`px-4 py-1.5 rounded-lg font-bold text-sm transition-all ${syllabus === 'foundation' ? 'bg-slate-100 text-emerald-700 shadow-inner' : 'text-slate-500 hover:text-slate-700'}`}
                                    >
                                        அடிப்படை (Foundation)
                                    </button>
                                </div>
                            </div>

                            {/* Student Selection */}
                            <div className="flex flex-wrap items-center gap-3">
                                <select 
                                    value={student.class} 
                                    onChange={e => setStudent({ class: e.target.value, name: '', index: '', mtl: '' })}
                                    className="border-2 border-slate-200 rounded-xl px-3 py-2 bg-white focus:ring-4 focus:ring-blue-500/20 outline-none font-bold text-slate-800 cursor-pointer shadow-sm"
                                >
                                    <option value="">- வகுப்பு -</option>
                                    {availableClasses.map(c => <option key={c} value={c}>{c}</option>)}
                                </select>
                                
                                <select 
                                    value={student.name} 
                                    onChange={handleStudentSelect}
                                    disabled={!student.class}
                                    className="w-40 md:w-64 border-2 border-slate-200 rounded-xl px-3 py-2 bg-white focus:ring-4 focus:ring-blue-500/20 outline-none font-bold text-blue-700 shadow-sm cursor-pointer disabled:bg-slate-100 disabled:cursor-not-allowed"
                                >
                                    <option value="">- மாணவர் பெயர் -</option>
                                    {filteredStudents.map((s, i) => <option key={i} value={s.name}>{s.name}</option>)}
                                </select>

                                <div className="flex items-center space-x-2 md:border-l-2 md:border-slate-200 md:pl-4">
                                    <select 
                                        value={currentExaminer}
                                        onChange={handleExaminerChange}
                                        className="border-2 border-purple-200 rounded-xl px-3 py-2 bg-purple-50 focus:ring-4 focus:ring-purple-500/20 outline-none font-bold text-purple-800 shadow-sm cursor-pointer"
                                    >
                                        <option value="">- மதிப்பீட்டாளர் -</option>
                                        {examinersList.map(t => <option key={t} value={t}>{t}</option>)}
                                    </select>
                                </div>
                                
                                {student.mtl && (
                                    <span className="bg-white text-slate-600 text-xs px-2 py-1 rounded-md border border-slate-200 font-bold shadow-sm">
                                        MTL: {student.mtl}
                                    </span>
                                )}
                            </div>
                        </div>

                        {/* Live Score Summary */}
                        <div className="flex items-center justify-end space-x-4 md:space-x-6 w-full xl:w-auto bg-white/50 xl:bg-transparent p-3 xl:p-0 rounded-2xl xl:rounded-none">
                            <div className="text-center">
                                <div className="text-xs text-slate-500 font-bold mb-1">வாசித்தல் Subtotal</div>
                                <div className="font-black text-xl text-indigo-600">{readingCombined}<span className="text-sm text-slate-400 font-medium">/{maxReading}</span></div>
                            </div>
                            <div className="text-center">
                                <div className="text-xs text-slate-500 font-bold mb-1">உரையாடல் Subtotal</div>
                                <div className="font-black text-xl text-indigo-600">{convTotal}<span className="text-sm text-slate-400 font-medium">/{maxConv}</span></div>
                            </div>
                            <div className={`text-center px-6 py-2 rounded-2xl shadow-md transition-colors ${syllabus === 'foundation' ? 'bg-emerald-600' : 'bg-blue-600'} text-white`}>
                                <div className="text-xs font-bold opacity-90 mb-1">மொத்த மதிப்பெண்</div>
                                <div className="font-black text-3xl leading-none">{grandTotal}<span className="text-sm font-medium opacity-80 ml-1">/{maxTotal}</span></div>
                            </div>
                        </div>
                    </div>

                    {/* Print Only View */}
                    <div className="print-only print-container">
                        <div>
                            <div className="text-center mb-4 border-b-2 border-slate-200 pb-4">
                                <h1 className="text-2xl font-black text-slate-900 mb-1 tracking-wide">🌟 Alexandra வாய்மொழி மதிப்பீடு – தொடக்கநிலை 5 (2026) 🌟</h1>
                                <p className="text-slate-500 mb-2 text-base">({syllabus === 'standard' ? 'சாதாரண (Standard) நிலை' : 'அடிப்படை (Foundation) நிலை'})</p>
                                <div className="flex justify-center flex-wrap gap-6 text-base text-slate-700 font-medium">
                                    <span>வகுப்பு: <strong className="text-slate-900 font-black">{student.class || "-"}</strong></span>
                                    <span>பெயர்: <strong className="text-slate-900 font-black">{student.name || "பெயர் இல்லை"}</strong></span>
                                </div>
                            </div>
                            
                            <div className="flex justify-center items-center gap-4 mb-4">
                                <div className="bg-slate-50 border-2 border-slate-200 rounded-2xl p-3 w-32 text-center">
                                    <div className="text-slate-600 font-bold text-xs mb-1">வாசித்தல்</div>
                                    <div className="text-xl font-black text-slate-800">{readingCombined} <span className="text-sm font-normal text-slate-400">/ {maxReading}</span></div>
                                </div>
                                <div className="text-xl text-slate-300 font-light">+</div>
                                <div className="bg-slate-50 border-2 border-slate-200 rounded-2xl p-3 w-32 text-center">
                                    <div className="text-slate-600 font-bold text-xs mb-1">உரையாடல்</div>
                                    <div className="text-xl font-black text-slate-800">{convTotal} <span className="text-sm font-normal text-slate-400">/ {maxConv}</span></div>
                                </div>
                                <div className="text-xl text-slate-300 font-light">=</div>
                                <div className={`border-4 rounded-2xl p-4 w-36 text-center shadow-sm ${syllabus === 'foundation' ? 'bg-emerald-50 border-emerald-200' : 'bg-blue-50 border-blue-200'}`}>
                                    <div className={`font-bold text-xs mb-1 ${syllabus === 'foundation' ? 'text-emerald-700' : 'text-blue-700'}`}>மொத்த மதிப்பெண்</div>
                                    <div className={`text-3xl font-black ${syllabus === 'foundation' ? 'text-emerald-800' : 'text-blue-800'}`}>{grandTotal} <span className={`text-base ${syllabus === 'foundation' ? 'text-emerald-400' : 'text-blue-400'}`}>/ {maxTotal}</span></div>
                                </div>
                            </div>

                            <div className="mb-4">
                                <h2 className="text-lg font-black text-slate-900 mb-2 flex items-center">
                                    <span className={`w-7 h-7 rounded-full flex items-center justify-center mr-2 text-base ${syllabus === 'foundation' ? 'bg-emerald-100 text-emerald-700' : 'bg-blue-100 text-blue-700'}`}>💡</span> 
                                    ஆசிரியர் குறிப்பு / பின்னூட்டம்:
                                </h2>
                                <div className="bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 text-base text-slate-800 leading-normal font-medium text-justify whitespace-pre-wrap">
                                    {feedbackText || "ஆசிரியர் இன்னும் மதிப்பீட்டை முடிக்கவில்லை."}
                                </div>
                            </div>
                        </div>

                        <div className="text-center pt-2 pb-2 text-slate-500 font-black text-base tracking-widest border-t border-slate-100">
                            தொடர்ந்து முயற்சி செய்! உனது வெற்றியைக் காண ஆவலுடன் காத்திருக்கிறோம்! 🚀
                        </div>
                    </div>

                    {/* Interactive Rubrics Area */}
                    <div className="no-print">
                        <div className="mb-12">
                            <h2 className={`text-2xl font-black text-slate-800 mb-6 px-4 border-l-8 rounded-sm ${syllabus === 'foundation' ? 'border-emerald-500' : 'border-blue-600'}`}>
                                பகுதி 1: வாய்விட்டு வாசித்தல் ({isFoundation ? '15 மதிப்பெண்கள் [(உச்சரிப்பு + சரளம்) ÷ 2]' : '20 மதிப்பெண்கள்'})
                            </h2>
                            {renderRubricRow('readingPron', currentRubrics.readingPron)}
                            {renderRubricRow('readingFluency', currentRubrics.readingFluency)}
                        </div>

                        <div className="mb-12">
                            <h2 className={`text-2xl font-black text-slate-800 mb-6 px-4 border-l-8 rounded-sm ${syllabus === 'foundation' ? 'border-emerald-500' : 'border-green-500'}`}>
                                பகுதி 2: உரையாடல் ({maxConv} மதிப்பெண்கள்)
                            </h2>
                            {renderRubricRow('convResponse', currentRubrics.convResponse)}
                            {renderRubricRow('convLanguage', currentRubrics.convLanguage)}
                        </div>

                        {/* Feedback Editor Area */}
                        <div className={`mt-12 p-6 md:p-8 rounded-3xl border-2 shadow-sm ${syllabus === 'foundation' ? 'bg-emerald-50/50 border-emerald-100' : 'bg-blue-50/50 border-blue-100'}`}>
                            <h3 className={`font-black text-xl md:text-2xl mb-4 flex items-center ${syllabus === 'foundation' ? 'text-emerald-900' : 'text-blue-900'}`}>
                                📝 பின்னூட்டம் 
                                <span className={`text-sm font-normal ml-3 px-3 py-1 rounded-full ${syllabus === 'foundation' ? 'text-emerald-600 bg-emerald-100' : 'text-blue-600 bg-blue-100'}`}>
                                    (முழுமையாக மாற்றக்கூடியது)
                                </span>
                            </h3>
                            <textarea 
                                className={`w-full h-48 md:h-64 p-6 rounded-2xl border-2 focus:ring-4 outline-none resize-none text-slate-800 text-lg leading-relaxed text-justify shadow-inner bg-white ${syllabus === 'foundation' ? 'border-emerald-200 focus:ring-emerald-500/20 focus:border-emerald-500' : 'border-blue-200 focus:ring-blue-500/20 focus:border-blue-500'}`}
                                value={feedbackText}
                                onChange={(e) => setFeedbackText(e.target.value)}
                                placeholder="மதிப்பெண்களைத் தேர்ந்தெடுக்கும் போது பின்னூட்டம் இங்கு தானாகவே உருவாகும். உங்கள் குறிப்புகளை இங்கு நேரடியாகத் தட்டச்சு செய்யலாம்."
                            ></textarea>
                            
                            <div className="flex flex-col md:flex-row justify-between items-center mt-8 gap-4 pt-6 border-t border-slate-200/60">
                                <button 
                                    onClick={resetForm} 
                                    className="flex items-center text-slate-600 bg-white hover:bg-slate-100 border-2 border-slate-200 font-bold text-base px-6 py-3 rounded-xl transition-all order-2 md:order-1 shadow-sm"
                                >
                                    🔄 படிவத்தை அழி 
                                </button>
                                
                                <div className="flex flex-col sm:flex-row space-y-3 sm:space-y-0 sm:space-x-3 w-full md:w-auto order-1 md:order-2">
                                    <button 
                                        onClick={handleSavePDF}
                                        className="justify-center bg-white border-2 border-slate-300 hover:border-slate-400 text-slate-800 px-6 py-3 rounded-xl font-bold text-base shadow-sm flex items-center transition-all"
                                    >
                                        💾 PDF சேமி
                                    </button>
                                    <button 
                                        onClick={handleSubmitGAS}
                                        disabled={submitStatus === 'loading'}
                                        className={`justify-center text-white px-8 py-3 rounded-xl font-bold text-base shadow-md flex items-center transition-all transform hover:-translate-y-0.5 ${
                                            submitStatus === 'loading' 
                                            ? 'bg-indigo-400' 
                                            : (syllabus === 'foundation' ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-indigo-600 hover:bg-indigo-700')
                                        }`}
                                    >
                                        {submitStatus === 'loading' ? '☁️ அனுப்புகிறது...' : '☁️ Cloud-இல் சேமி'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
